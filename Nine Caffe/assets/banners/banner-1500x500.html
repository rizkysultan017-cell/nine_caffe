<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Nine Cafe & Eatery — banner 1500×500 (contoh desain)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { width: 1500px; height: 500px; margin: 0; overflow: hidden; }
  body {
    position: relative;
    display: flex; align-items: center;
    padding: 58px 64px;
    gap: 52px;
    background:
      radial-gradient(circle at 88% 16%, rgba(228,195,106,.2), transparent 38%),
      radial-gradient(circle at 8% 92%, rgba(156,74,46,.28), transparent 42%),
      #203026;
    color: #F2EBDD;
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 24px; flex-shrink: 0; }
  .logo { width: 148px; height: 148px; border-radius: 50%; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  .brand b { display: block; font-family: Fraunces, Georgia, serif; font-size: 47px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .brand span { display: block; margin-top: 12px; font-size: 20px; letter-spacing: 0.2em; text-transform: uppercase; color: #E4C36A; }
  .divider { width: 1px; height: 300px; background: rgba(242,235,221,.22); flex-shrink: 0; }
  .copy { min-width: 0; }
  h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 78px; line-height: .96; letter-spacing: -0.045em; }
  h1 em { font-style: italic; color: #E4C36A; }
  p { margin: 18px 0 0; font-size: 25px; line-height: 1.45; color: rgba(242,235,221,.82); }
  .facts { display: flex; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  .fact { padding: 13px 20px; border-radius: 999px; font-size: 20px; font-weight: 600; white-space: nowrap; background: rgba(242,235,221,.1); border: 1px solid rgba(242,235,221,.2); }
  .fact b { color: #E4C36A; }
  .menu { margin-left: auto; width: 360px; flex-shrink: 0; padding: 24px 26px; border-radius: 22px; background: rgba(15,20,25,.34); border: 1px solid rgba(242,235,221,.16); }
  .menu b { display: block; font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; color: #E4C36A; }
  .menu .row { display: flex; align-items: baseline; gap: 12px; margin-top: 16px; font-size: 19px; }
  .menu .row i { flex: 1; border-bottom: 1px dotted rgba(242,235,221,.35); transform: translateY(-6px); }
  .menu .row strong { font-weight: 700; font-variant-numeric: tabular-nums; }
  .stamp { position: absolute; top: 22px; right: 26px; padding: 8px 14px; border-radius: 999px; background: #E4C36A; color: #17211B; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
</style>
</head>
<body>
  <span class="stamp">Contoh desain</span>
  <div class="brand">
    <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="60" fill="#FFFBF3" />
      <text x="17" y="88" font-family="Fraunces, Georgia, serif" font-size="88" font-weight="600" letter-spacing="-6" fill="#111612">9</text>
      <g transform="translate(91 21) rotate(90)"><text x="0" y="0" font-family="Fraunces, Georgia, serif" font-size="25" font-weight="600" letter-spacing="1.8" fill="#111612">NINE.</text></g>
    </svg>
    <div><b>Nine Cafe<br />&amp; Eatery</b><span>Dau · Kabupaten Malang</span></div>
  </div>
  <div class="divider"></div>
  <div class="copy">
    <h1>Tinggal <em>lebih lama.</em></h1>
    <p>Kopi dan santapan hangat untuk obrolan yang belum selesai.</p>
    <div class="facts">
      <span class="fact">Buka setiap hari <b>13.00–00.00</b></span>
      <span class="fact">Menu mulai <b>Rp 10.000</b></span>
    </div>
  </div>
  <div class="menu">
    <b>Dari menu</b>
    <div class="row"><span>Aren Latte</span><i></i><strong>Rp 18.000</strong></div>
    <div class="row"><span>Nasi Goreng Special</span><i></i><strong>Rp 20.000</strong></div>
    <div class="row"><span>Signature Banana</span><i></i><strong>Rp 15.000</strong></div>
  </div>
</body>
</html>
